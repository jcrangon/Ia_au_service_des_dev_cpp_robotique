# Pipeline CI de base : il sert à rendre les vérifications reproductibles.
# Le code source et les tests sont compilés sur un runner Linux hébergé.
name: IndustrialMonitor CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le commit exact de la PR
        uses: actions/checkout@v4

      # En production, figer les actions par SHA et contrôler leur provenance.
      - name: Installer Clang et Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Configurer CMake pour Clang
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Compiler
        run: cmake --build build --parallel 2

      # CTest propage un code de sortie non nul si un test déclaré échoue.
      - name: Exécuter les tests du dépôt
        run: ctest --test-dir build --output-on-failure
